# Requires GitHub vars WIF_PROVIDER and WIF_SERVICE_ACCOUNT (GCP Workload Identity Federation). See docs/DEPLOYMENT.md

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Unused; image is always built from the checked-out git ref
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: wineia-490200
  SERVICE: wine-concierge
  REGION: southamerica-east1
  IMAGE: southamerica-east1-docker.pkg.dev/wineia-490200/wine-concierge/wine-concierge

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import style
        run: python quality/check_import_style.py

      - name: Ruff lint
        run: ruff check api core domain infrastructure tests quality

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Set image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "${IMAGE}:${SHA}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
          } > tags.txt
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat tags.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run (no traffic)
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${SHA}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --project "${PROJECT_ID}"
        env:
          SERVICE: ${{ env.SERVICE }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ steps.meta.outputs.sha }}
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Shift traffic to latest revision
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --to-latest \
            --region "${REGION}" \
            --project "${PROJECT_ID}"
        env:
          SERVICE: ${{ env.SERVICE }}
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
